name: garage
description: "Smart car companion app — Garage"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP + auth storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.6.2

  # Photos & OCR camera flow
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1
  file_picker: ^8.1.4

  # Local persistence (cache) — SQLite via sqflite
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Notifications + permissions + geofencing
  flutter_local_notifications: ^17.2.4
  permission_handler: ^11.3.1
  geofence_service: ^6.0.0+1
  geolocator: ^13.0.2

  # Misc UX
  intl: ^0.20.0
  shimmer: ^3.0.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
